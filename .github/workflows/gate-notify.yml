name: gate-notify

# 关闭门禁 issue 时，从仓库读取实测结果文件做数值比对。
# 不达标 / 文件缺失 / 数据过期 -> 自动重开。人手打的数字一律不采信。
on:
  issues:
    types: [closed]

permissions:
  issues: write
  contents: read

jobs:
  verify:
    if: contains(join(github.event.issue.labels.*.name, ','), 'gate:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          NOTIFY: dylanyunlon
          HARD_ONLY: 'false'
          MAX_AGE_DAYS: '14'
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const { owner, repo } = context.repo;
            const num = issue.number;
            const isHard = issue.labels.some(l => l.name === 'gate:hard');
            const OP = {
              le: [(a,b)=>a<=b, '≤'], ge: [(a,b)=>a>=b, '≥'],
              eq: [(a,b)=>a===b, '='], lt: [(a,b)=>a<b, '<'], gt: [(a,b)=>a>b, '>']
            };

            async function reject(title, detail) {
              await github.rest.issues.update({ owner, repo, issue_number: num, state: 'open' });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: num, labels: ['needs-receipt'] });
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: num, name: 'verified' }).catch(()=>{});
              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: `**已自动重新打开：${title}**\n\n${detail}`
              });
              core.setFailed(`#${num} ${title}`);
            }

            // 1. 取阈值声明
            const spec = (issue.body || '').match(/<!-- gate-spec\s*([\s\S]*?)-->/);
            if (!spec) return reject('issue 正文缺少 gate-spec 阈值声明',
              '正文里必须有 `<!-- gate-spec [...] -->` 块，否则无从比对。');
            let checks;
            try { checks = JSON.parse(spec[1].trim()); }
            catch (e) { return reject('gate-spec 不是合法 JSON', '```\n' + e.message + '\n```'); }

            // 2. 取结果文件
            const path = `bench/results/gate-${String(num).padStart(3,'0')}.json`;
            if (!fs.existsSync(path))
              return reject('缺少实测结果文件',
                `需要 \`${path}\`，提交到 main 之后再关闭。\n格式见 \`bench/results/README.md\`。`);
            let res;
            try { res = JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (e) { return reject(`${path} 不是合法 JSON`, '```\n' + e.message + '\n```'); }

            // 3. 溯源字段
            for (const f of ['commit', 'host', 'timestamp'])
              if (!res[f]) return reject(`结果文件缺少 \`${f}\` 字段`,
                '每份结果必须能追溯到一次具体的运行：跑在哪个 commit、哪台机器、什么时候。');
            const ageDays = (Date.now() - Date.parse(res.timestamp)) / 864e5;
            if (!(ageDays >= 0)) return reject('timestamp 无法解析', '请用 ISO 8601，例如 `2026-09-30T11:20:00Z`。');
            const maxAge = Number(process.env.MAX_AGE_DAYS);
            if (ageDays > maxAge)
              return reject('实测数据过期',
                `这份结果是 ${ageDays.toFixed(1)} 天前的，超过 ${maxAge} 天上限。代码早变了，重跑一次。`);
            try { await github.rest.repos.getCommit({ owner, repo, ref: res.commit }); }
            catch (e) { return reject('结果文件里的 commit 在本仓库找不到',
              `\`${res.commit}\` —— 基准必须跑在一个已推送的提交上。`); }

            // 4. 逐条数值比对
            const rows = [], fails = [];
            for (const c of checks) {
              if (c.m === 'doc') {
                const d = res.doc;
                const okDoc = d && fs.existsSync(d);
                rows.push(`| \`doc\` | 文件存在 | ${d ? '`'+d+'`' : '(未填写)'} | ${okDoc ? '通过' : '**不通过**'} |`);
                if (!okDoc) fails.push(`doc: ${d ? '`'+d+'` 在仓库中不存在' : '结果文件里没有 doc 字段'}`);
                continue;
              }
              const v = res.metrics ? res.metrics[c.m] : undefined;
              if (typeof v !== 'number') {
                rows.push(`| \`${c.m}\` | ${OP[c.op][1]} ${c.t} | (缺失或非数值) | **不通过** |`);
                fails.push(`\`${c.m}\`: metrics 里没有这个数值`);
                continue;
              }
              const pass = OP[c.op][0](v, c.t);
              const u = (c.u && c.u !== 'bool') ? ' ' + c.u : '';
              rows.push(`| \`${c.m}\` | ${OP[c.op][1]} ${c.t}${u} | ${v}${u} | ${pass ? '通过' : '**不通过**'} |`);
              if (!pass) fails.push(`\`${c.m}\` = ${v}${u}，要求 ${OP[c.op][1]} ${c.t}${u}`);
            }
            const table = ['| 指标 | 要求 | 实测 | 判定 |', '|---|---|---|---|', ...rows].join('\n');

            if (fails.length)
              return reject(`${fails.length} 项指标未达标`,
                table + '\n\n' + fails.map(f => '- ' + f).join('\n') +
                `\n\n改完重跑，更新 \`${path}\`，再关一次。`);

            // 5. 通过
            await github.rest.issues.addLabels({
              owner, repo, issue_number: num, labels: ['verified'] });
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: num, name: 'needs-receipt' }).catch(()=>{});

            const hardOnly = process.env.HARD_ONLY === 'true';
            const at = (!hardOnly || isHard) ? `@${process.env.NOTIFY} ` : '';
            await github.rest.issues.createComment({
              owner, repo, issue_number: num,
              body: [
                `${at}**${isHard ? '硬门禁通过' : '指标达标'}** — ${issue.title}`,
                '', table, '',
                `commit \`${String(res.commit).slice(0,8)}\` · ${res.host} · ${res.timestamp}`,
                issue.milestone ? `里程碑：${issue.milestone.title}` : '',
                isHard ? '\n本里程碑后续 PR 解除挂起。' : ''
              ].filter(Boolean).join('\n')
            });
            core.notice(`#${num} 通过`);
